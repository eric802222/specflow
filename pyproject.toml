[project]
name = "specflow"
version = "0.1.0"
description = "Everything-as-Code 全端規格編譯與 AI 交付管線工具"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
specflow = "bin.specflow:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bin", "lib", "lib.linters", "lib.analyzers", "lib.generators", "lib.workflow"]
